services:

  postgres:
    image: pgvector/pgvector:pg17       # includes the pgvector extension used by VectorStoreConfiguration
    container_name: ragmvp1-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: ragmvp1-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Uncomment and set these when switching embedding provider:
      # APP_EMBEDDING_PROVIDER: openai
      # OPENAI_API_KEY: sk-...
      # APP_LLM_ENABLED: "true"
      # APP_LLM_PROVIDER: openai
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
